[package]
name = "panarchiv-app"
description = "Panarchiv desktop and mobile GUI"
version = "0.1.5"
edition = "2021"
authors = ["Devanand P A"]
license = "MIT"

[lib]
name = "panarchiv_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
panarchiv-core = { path = "../../../crates/panarchiv-core" }

# Android-only: used by the "open with another app" chooser (ACTION_VIEW) in
# lib.rs. These are already pulled in transitively by wry/tao, so versions match
# Cargo.lock to avoid duplicate copies.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
