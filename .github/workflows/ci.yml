name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Test core and CLI
        run: cargo test --workspace

      - name: Build core and CLI
        run: cargo build --workspace

  gui-linux:
    name: GUI build (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> apps/desktop/src-tauri/target

      - name: Install WebKitGTK and GTK development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build Tauri backend
        working-directory: apps/desktop/src-tauri
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build

  android:
    name: Android APK (ARM64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri -> apps/desktop/src-tauri/target

      - name: Install frontend tooling
        working-directory: apps/desktop
        run: npm install

      - name: Generate Android project
        working-directory: apps/desktop
        env:
          CI: "true"
        run: npx tauri android init --ci

      - name: Build Android APK
        working-directory: apps/desktop
        env:
          CI: "true"
        run: npx tauri android build --ci --apk --target aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: panarchiv-android-arm64
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
